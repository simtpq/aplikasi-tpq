<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient (Soft sky blue to ice blue/white glow center) -->
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="12%" stop-color="#e6fffa" />
      <stop offset="35%" stop-color="#f5f9ff" />
      <stop offset="60%" stop-color="#f5f9ff" />
      <stop offset="82%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>

    <!-- Top Left Light Wave Glow -->
    <linearGradient id="topLeftGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Mosque Silhouette Blue Gradient -->
    <linearGradient id="mosqueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0.25" />
    </linearGradient>

    <!-- Golden Arc Gradient -->
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fcd34d" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Bottom Wave Fill Gradient -->
    <linearGradient id="bottomWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#14b8a6" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="1.0" />
    </linearGradient>

    <!-- Bottom Wave Inner Light Glow -->
    <linearGradient id="innerWaveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Islamic Star Pattern -->
    <pattern id="islamicPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#0d9488" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="40" cy="40" r="16" fill="none" stroke="#0d9488" stroke-width="0.5" stroke-opacity="0.03" />
      <path d="M20 20 L60 60 M60 20 L20 60" stroke="#0d9488" stroke-width="0.4" stroke-opacity="0.025" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- 1. Sky Base -->
  <rect width="1000" height="2000" fill="url(#skyBg)" />

  <!-- 2. Subtle Texture Overlay -->
  <rect width="1000" height="2000" fill="url(#islamicPattern)" />

  <!-- 3. Top-Left Soft Light Curved Waves -->
  <path d="M -50 -50 L 600 -50 C 420 200, 200 350, -50 420 Z" fill="url(#topLeftGlow)" />
  <path d="M -30 -30 C 400 130, 180 300, -30 380" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.85" />
  <path d="M -30 10 C 360 150, 150 310, -30 350" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.55" />

  <!-- 4. Mosque Silhouette at Bottom Center -->
  <g id="mosque-silhouette" fill="url(#mosqueGrad)">
    <!-- Base -->
    <rect x="280" y="1660" width="440" height="200" rx="8" />

    <!-- Main Center Dome -->
    <path d="M 360 1660 C 360 1510, 640 1510, 640 1660 Z" />
    <!-- Center Dome Spire & Crescent Moon -->
    <path d="M 497 1510 L 503 1510 L 502 1440 L 498 1440 Z" fill="#14b8a6" />
    <!-- Crescent Moon Icon -->
    <path d="M 500 1420 A 14 14 0 1 0 512 1438 A 11 11 0 1 1 500 1420 Z" fill="#14b8a6" />

    <!-- Mid-Left Dome -->
    <path d="M 250 1680 C 250 1570, 380 1570, 380 1680 Z" />
    <path d="M 313 1570 L 317 1570 L 316 1530 L 314 1530 Z" fill="#14b8a6" />
    <path d="M 315 1520 A 7 7 0 1 0 321 1529 A 5.5 5.5 0 1 1 315 1520 Z" fill="#14b8a6" />

    <!-- Mid-Right Dome -->
    <path d="M 620 1680 C 620 1570, 750 1570, 750 1680 Z" />
    <path d="M 683 1570 L 687 1570 L 686 1530 L 684 1530 Z" fill="#14b8a6" />
    <path d="M 685 1520 A 7 7 0 1 0 691 1529 A 5.5 5.5 0 1 1 685 1520 Z" fill="#14b8a6" />

    <!-- Outer-Left Small Dome -->
    <path d="M 180 1710 C 180 1630, 270 1630, 270 1710 Z" />
    <!-- Outer-Right Small Dome -->
    <path d="M 730 1710 C 730 1630, 820 1630, 820 1710 Z" />

    <!-- Tall Minaret Inner Left -->
    <rect x="238" y="1540" width="24" height="220" rx="3" />
    <polygon points="232,1540 268,1540 250,1470" />
    <rect x="234" y="1590" width="32" height="10" rx="2" />

    <!-- Tall Minaret Inner Right -->
    <rect x="738" y="1540" width="24" height="220" rx="3" />
    <polygon points="732,1540 768,1540 750,1470" />
    <rect x="734" y="1590" width="32" height="10" rx="2" />

    <!-- Outer Minaret Left -->
    <rect x="130" y="1580" width="20" height="200" rx="2.5" />
    <polygon points="125,1580 155,1580 140,1520" />

    <!-- Outer Minaret Right -->
    <rect x="850" y="1580" width="20" height="200" rx="2.5" />
    <polygon points="845,1580 875,1580 860,1520" />

    <!-- Far Edge Minarets -->
    <rect x="60" y="1630" width="16" height="150" rx="2" />
    <polygon points="56,1630 80,1630 68,1580" />

    <rect x="924" y="1630" width="16" height="150" rx="2" />
    <polygon points="920,1630 944,1630 932,1580" />
  </g>

  <!-- 5. Bottom Parabolic Wave & Golden Arc -->

  <!-- Outer Soft Shadow Glow for Wave -->
  <path d="M -50 1610 Q 500 1950 1050 1610 L 1050 2050 L -50 2050 Z" fill="#0d9488" opacity="0.12" filter="url(#softGlow)" />

  <!-- Main Bottom Blue Wave Fill -->
  <path d="M -50 1620 Q 500 1960 1050 1620 L 1050 2050 L -50 2050 Z" fill="url(#bottomWave)" />

  <!-- Inner Top Glow of Bottom Wave -->
  <path d="M -50 1620 Q 500 1960 1050 1620 L 1050 1700 Q 500 1980 -50 1700 Z" fill="url(#innerWaveGlow)" opacity="0.65" />

  <!-- Metallic Gold Arc Accent Line -->
  <path d="M -50 1620 Q 500 1960 1050 1620" fill="none" stroke="url(#goldArc)" stroke-width="5" />

  <!-- Bright White Highlight Line above Gold Line -->
  <path d="M -50 1615 Q 500 1955 1050 1615" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95" />
</svg>
